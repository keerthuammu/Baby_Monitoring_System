# ==============================================================================
# Render Infrastructure Blueprint — Smart Baby Monitoring System
# Deploy PostgreSQL, FastAPI Backend, and React Dashboard in 1-Click
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Python Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: baby-monitor-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: baby-monitor-db
          property: connectionString
      - key: API_KEY
        value: baby_monitor_device_secret_key_123
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: SOUND_HIGH_THRESHOLD
        value: "65.0"

  # ----------------------------------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: baby-monitor-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: baby-monitor-backend
          property: host

databases:
  # ----------------------------------------------------------------------------
  # 3. Managed PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: baby-monitor-db
    databaseName: baby_monitor_db
    user: postgres
    region: oregon
    plan: free
